# Deploys BizSocial360 to the Azure staging environment and runs end-to-end
# tests against the deployed staging URL.
#
# Required GitHub configuration (Settings → Secrets and variables → Actions):
#
#   Secrets:
#     AZURE_CLIENT_ID         — App registration (federated/OIDC) client id
#     AZURE_TENANT_ID         — Azure AD tenant id
#     AZURE_SUBSCRIPTION_ID   — Azure subscription id
#     STAGING_DATABASE_URL    — Connection string for the staging PostgreSQL
#
#   Variables:
#     AZURE_API_APP_NAME      — App Service name hosting the API
#     AZURE_WEB_APP_NAME      — App Service name hosting the web app
#     STAGING_API_URL         — Public URL of the staging API (baked into web)
#     STAGING_WEB_URL         — Public URL of the staging web app (e2e target)
#
# The `staging` GitHub Environment can add required reviewers / protection rules.

name: Deploy to staging

# NOTE: Staging deployment is owned by Azure DevOps Pipelines (azure-pipelines.yml).
# This GitHub workflow is kept as a manual-only fallback to avoid double-deploying
# on push to `develop`. Run it from the Actions tab via "Run workflow".
on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for azure/login OIDC

jobs:
  verify:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bizsocial
          POSTGRES_PASSWORD: bizsocial
          POSTGRES_DB: bizsocial360
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bizsocial -d bizsocial360"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://bizsocial:bizsocial@localhost:5432/bizsocial360?schema=public
      TOKEN_ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
      JWT_SECRET: ci-jwt-secret
      OAUTH_STATE_SECRET: ci-oauth-state-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - name: Apply migrations (test database)
        run: npm run db:deploy --workspace apps/api
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build

  deploy:
    name: Deploy to Azure (staging)
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_WEB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate

      - name: Build API
        run: npm run build --workspace apps/api

      - name: Build web (staging API URL baked in)
        env:
          API_URL: ${{ vars.STAGING_API_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.STAGING_API_URL }}
        run: npm run build --workspace apps/web

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Apply database migrations (staging)
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npm run db:deploy --workspace apps/api

      - name: Deploy API to App Service (staging slot)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_API_APP_NAME }}
          slot-name: staging
          package: apps/api

      - name: Deploy web to App Service (staging slot)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEB_APP_NAME }}
          slot-name: staging
          package: apps/web

  e2e:
    name: E2E against staging
    needs: deploy
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      E2E_BASE_URL: ${{ vars.STAGING_WEB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests against staging
        run: npm run test:e2e --workspace apps/web
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
