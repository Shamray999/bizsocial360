# BizSocial360 — Azure DevOps deployment pipeline.
#
# Pipeline: verify (lint, typecheck, unit + integration tests, build) → deploy to
# the Azure staging environment → end-to-end tests against the live staging URL.
#
# ── One-time setup in Azure DevOps ───────────────────────────────────────────
# 1. Project Settings → Service connections → create an **Azure Resource Manager**
#    service connection (this authorizes deployments to your subscription).
# 2. Pipelines → Library → create a **variable group** named `bizsocial360-staging`
#    with the variables below (mark STAGING_DATABASE_URL as secret):
#
#      azureServiceConnection  Name of the ARM service connection from step 1
#      apiAppName              App Service name hosting the API (from Bicep output)
#      webAppName              App Service name hosting the web app
#      stagingApiUrl           Public URL of the staging API (baked into the web build)
#      stagingWebUrl           Public URL of the staging web app (the e2e target)
#      STAGING_DATABASE_URL    PostgreSQL connection string (secret)
#
# 3. Pipelines → New pipeline → point at this repo (GitHub) and select this file.
# 4. Pipelines → Environments → create an environment named `staging`
#    (optionally add approval checks/gates there).
#
# App Services are provisioned by infra/azure/main.bicep — deploy that first.

trigger:
  branches:
    include:
      - develop

pr: none

variables:
  - name: nodeVersion
    value: '22.x'
  # Non-secret values used only to satisfy config validation during CI tests.
  - name: CI_TOKEN_ENCRYPTION_KEY
    value: '00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff'

stages:
  # ───────────────────────────────────────────────────────────────────────────
  - stage: Verify
    displayName: Lint, typecheck, test & build
    jobs:
      - job: verify
        displayName: Verify
        pool:
          vmImage: ubuntu-latest
        variables:
          DATABASE_URL: 'postgresql://bizsocial:bizsocial@localhost:5432/bizsocial360?schema=public'
          TOKEN_ENCRYPTION_KEY: '$(CI_TOKEN_ENCRYPTION_KEY)'
          JWT_SECRET: 'ci-jwt-secret'
          OAUTH_STATE_SECRET: 'ci-oauth-state-secret'
        steps:
          - task: NodeTool@0
            displayName: Use Node.js $(nodeVersion)
            inputs:
              versionSpec: $(nodeVersion)

          - script: |
              docker run -d --name postgres \
                -e POSTGRES_USER=bizsocial \
                -e POSTGRES_PASSWORD=bizsocial \
                -e POSTGRES_DB=bizsocial360 \
                -p 5432:5432 postgres:16
              echo "Waiting for PostgreSQL to accept connections..."
              for i in $(seq 1 30); do
                if docker exec postgres pg_isready -U bizsocial -d bizsocial360 > /dev/null 2>&1; then
                  echo "PostgreSQL is ready."; exit 0
                fi
                sleep 2
              done
              echo "PostgreSQL did not become ready in time." >&2; exit 1
            displayName: Start PostgreSQL (Docker)

          - script: npm ci
            displayName: Install dependencies

          - script: npm run db:generate
            displayName: Generate Prisma client

          - script: npm run lint
            displayName: Lint

          - script: npm run typecheck
            displayName: Typecheck

          - script: npm run db:deploy --workspace apps/api
            displayName: Apply database migrations

          - script: npm run test:unit
            displayName: Unit tests

          - script: npm run test:integration
            displayName: Integration tests

          - script: npm run build
            displayName: Build

  # ───────────────────────────────────────────────────────────────────────────
  - stage: DeployStaging
    displayName: Deploy to Azure (staging)
    dependsOn: Verify
    condition: succeeded()
    # The staging variable group is only needed from here on, so the Verify stage
    # runs without any Azure configuration.
    variables:
      - group: bizsocial360-staging
    jobs:
      - deployment: deploy
        displayName: Deploy API & web
        pool:
          vmImage: ubuntu-latest
        environment: staging
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: NodeTool@0
                  displayName: Use Node.js $(nodeVersion)
                  inputs:
                    versionSpec: $(nodeVersion)

                - script: npm ci
                  displayName: Install dependencies

                - script: npm run db:generate
                  displayName: Generate Prisma client

                - script: npm run build --workspace apps/api
                  displayName: Build API

                - script: npm run build --workspace apps/web
                  displayName: Build web (staging API URL baked in)
                  env:
                    API_URL: $(stagingApiUrl)
                    NEXT_PUBLIC_API_URL: $(stagingApiUrl)

                - task: AzureCLI@2
                  displayName: Apply database migrations (staging)
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: npm run db:deploy --workspace apps/api
                  env:
                    DATABASE_URL: $(STAGING_DATABASE_URL)

                - task: AzureWebApp@1
                  displayName: Deploy API to App Service
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appType: webAppLinux
                    appName: $(apiAppName)
                    package: apps/api
                    startUpCommand: 'node dist/server.js'

                - task: AzureWebApp@1
                  displayName: Deploy web to App Service
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appType: webAppLinux
                    appName: $(webAppName)
                    package: apps/web
                    startUpCommand: 'npm run start'

  # ───────────────────────────────────────────────────────────────────────────
  - stage: E2E
    displayName: E2E against staging
    dependsOn: DeployStaging
    condition: succeeded()
    variables:
      - group: bizsocial360-staging
    jobs:
      - job: e2e
        displayName: Playwright e2e
        pool:
          vmImage: ubuntu-latest
        variables:
          CI: 'true'
          E2E_BASE_URL: $(stagingWebUrl)
        steps:
          - task: NodeTool@0
            displayName: Use Node.js $(nodeVersion)
            inputs:
              versionSpec: $(nodeVersion)

          - script: npm ci
            displayName: Install dependencies

          - script: npx playwright install --with-deps chromium
            displayName: Install Playwright browser
            workingDirectory: apps/web

          - script: npm run test:e2e --workspace apps/web
            displayName: Run end-to-end tests against staging

          - task: PublishTestResults@2
            displayName: Publish e2e test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: apps/web/test-results/junit.xml
              testRunTitle: Playwright E2E (staging)
              failTaskOnFailedTests: false

          - task: PublishPipelineArtifact@1
            displayName: Publish Playwright report
            condition: succeededOrFailed()
            inputs:
              targetPath: apps/web/playwright-report
              artifact: playwright-report
